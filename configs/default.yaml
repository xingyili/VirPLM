# Default config for VirPLM
seed: 3407
device: auto
seq_len: 328

pretrain:
  base_model_name: facebook/esm2_t30_150M_UR50D
  fasta_paths:
    - data/Seq/H3N2.fasta
  output_dir: H3pre_model
  batch_size: 16
  epochs: 10
  lr: 5.0e-4
  weight_decay: 0.01
  accumulation_steps: 4
  mlm_probability: 0.15
  warmup_ratio: 0.1

cross_validation:
  pretrained_model_dir: H3pre_model
  ha_path: data/NAD/H3N2_demo_HA.csv
  hi_path: data/NAD/H3N2_demo_HI.csv
  extra_ha_path: null
  extra_hi_path: null
  num_epochs: 50
  classification_threshold: 2.0
  batch_train: 8
  batch_eval: 16
  lr: 5.0e-5
  patience: 10
  num_workers: 4
  checkpoint_dir: checkpoints_CV
  result_csv: CV_results.csv
  cv_rounds: 1
  n_splits: 5
  skip_folds_before: 0
  deduplicate: true

backtest:
  pretrained_model_dir: H3pre_model
  ha_path: data/NAD/H3N2_demo_HA.csv
  hi_path: data/NAD/H3N2_demo_HI.csv
  extra_ha_path: null
  extra_hi_path: null
  num_epochs: 50
  classification_threshold: 2.0
  batch_train: 8
  batch_eval: 16
  lr: 5.0e-5
  patience: 10
  num_workers: 4
  checkpoint_dir: checkpoints_backtest
  result_csv: backtest_results.csv
  train_year_num: 7
  test_year_num: 1
  val_ratio: 0.2
  min_test_start_year: 2012
  descending: true
  deduplicate: false
